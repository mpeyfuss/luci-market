[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
auto_detect_solc = true
optimizer = true
optimizer_runs = 4269
verbosity = 3
gas_reports = ["LuciMarket", "LuciRoyaltyModel"]

fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 1024

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${ETH_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_KEY}" }
mainnet = { key = "${ETHERSCAN_KEY}" }

[dependencies]
forge-std = "1.14.0"
"@openzeppelin-contracts" = "5.6.1"
solady = "0.1.26"

